<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
   <center> <h1>Calculadora</h1>
    
    Primeiro número: <br />
    <input type="number" id="n1"><br />
    Segundo número: <br />
    <input type="number" id="n2"><br /><br />

    <button onclick="somar()">+</button>
    <button onclick="subtrair()">-</button>
    <button onclick="multiplicacao()">x</button>
    <button onclick="divisao()">/</button>
    <button onclick="areaquadrado()">□</button>
    <button onclick="areatriangulo()">△</button>
    <button onclick="porcentagem()">%</button>
    <button onclick="limpar()">CE</button>

    <br /><br />


    <button onclick="PrimeiroNumero()">Anterior</button> <button onclick="segundoNumero()">Próximo</button> <br /><br />
    

    <button onclick="inserir('1')">1</button>
    <button onclick="inserir('2')">2</button>
    <button onclick="inserir('3')">3</button><br />
    <button onclick="inserir('4')">4</button>
    <button onclick="inserir('5')">5</button>
    <button onclick="inserir('6')">6</button><br />
    <button onclick="inserir('7')">7</button>
    <button onclick="inserir('8')">8</button>
    <button onclick="inserir('9')">9</button><br />
    <button onclick="inserir('0')">0</button>

    <br /><br />
    O resultado é: <span id="resultado"></span> </center>

    <!-- Ajuste o caminho abaixo se o arquivo não estiver na pasta "js" -->
    <script src="js/calculo.js"></script>
</body>
</html>
